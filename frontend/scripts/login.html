<!DOCTYPE html> <!-- Define que o documento segue o padrão HTML5 -->
<html lang="pt-br"> <!-- Define o idioma principal da página como Português do Brasil -->

<head>
    <meta charset="UTF-8"> <!-- Configura a codificação de caracteres para UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Garante o suporte a layouts responsivos -->
    <title>Login - Gerenciador de Tarefas</title> <!-- Título exibido na aba do navegador -->
    
    <!-- Importação do CSS do Framework Bootstrap 5 para estilização dos componentes -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center vh-100"> <!-- Fundo claro e centralização vertical/horizontal -->

    <div class="container"> <!-- Container do Bootstrap para alinhamento da estrutura -->
        <div class="row justify-content-center"> <!-- Linha centralizada para o formulário -->
            <div class="col-md-4"> <!-- Coluna com largura média proporcional de 4 grids -->
                <div class="card shadow-sm"> <!-- Cartão com borda e sombra leve -->
                    <div class="card-body p-4"> <!-- Corpo interno do cartão com espaçamento interno -->
                        <h3 class="text-center mb-4">Login</h3> <!-- Título centralizado da tela de login -->

                        <!-- Formulário de Login que evita o recarregamento chamando a função JavaScript login() -->
                        <form onsubmit="login(event)">
                            
                            <div class="mb-3"> <!-- Bloco de entrada para o nome de usuário -->
                                <label for="username" class="form-label">Usuário</label> <!-- Rótulo do campo -->
                                <input type="text" id="username" class="form-control" placeholder="Digite seu usuário" required> <!-- Campo de texto obrigatório -->
                            </div>

                            <div class="mb-3"> <!-- Bloco de entrada para a senha -->
                                <label for="password" class="form-label">Senha</label> <!-- Rótulo do campo -->
                                <input type="password" id="password" class="form-control" placeholder="Digite sua senha" required> <!-- Campo de senha obrigatório -->
                            </div>

                            <!-- Botão de submissão do formulário de autenticação -->
                            <button type="submit" class="btn btn-primary w-100 mb-3">Entrar</button>
                        </form>

                        <!-- Link para redirecionar usuários não cadastrados para a página de registro -->
                        <div class="text-center">
                            <small>Não tem uma conta? <a href="signup.html">Cadastre-se</a></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Importação do script JavaScript exclusivo da lógica de login -->
    <script src="scripts/login.js"></script>
</body>

</html>
